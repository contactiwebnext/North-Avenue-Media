<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" fill="#000000" rx="16"/>
  <g fill="#FFFFFF">
    <!-- Top Horizontal Bar -->
    <rect x="18" y="20" width="64" height="4.5" />
    
    <!-- Sub Bars (Left & Right) -->
    <rect x="18" y="29.5" width="28" height="4.5" />
    <rect x="54" y="29.5" width="28" height="4.5" />
    
    <!-- N Left Vertical Leg -->
    <rect x="18" y="29.5" width="4.5" height="46.5" />
    
    <!-- N Diagonal Stroke to bottom center-right -->
    <polygon points="22.5,34 22.5,41 52,76 58,76 58,69 28.5,34" />
    
    <!-- A Center Stem / Apex -->
    <polygon points="53.5,29.5 58,29.5 58,76 53.5,76" />
    
    <!-- A Right Leg -->
    <polygon points="77.5,29.5 82,29.5 82,76 77.5,76" />
    
    <!-- A Crossbar -->
    <polygon points="56,54 80,54 80,58.5 56,58.5" />
  </g>
</svg>
