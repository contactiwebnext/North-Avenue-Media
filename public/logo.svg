<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <!-- Monogram NA -->
  <g fill="#000000">
    <!-- Top Horizontal Full Bar -->
    <rect x="75" y="25" width="170" height="9" />
    
    <!-- Sub Bar Left & Right -->
    <rect x="75" y="44" width="70" height="9" />
    <rect x="175" y="44" width="70" height="9" />
    
    <!-- N Left Vertical Leg -->
    <rect x="75" y="44" width="9" height="95" />
    
    <!-- N Diagonal Stroke -->
    <polygon points="84,53 84,68 166,139 175,139 175,124 93,53" />
    
    <!-- A Center Vertical Pillar -->
    <rect x="166" y="44" width="9" height="95" />
    
    <!-- A Right Leg -->
    <polygon points="236,44 245,44 245,139 236,139" />
    
    <!-- A Crossbar -->
    <rect x="175" y="93" width="70" height="9" />
  </g>
  
  <!-- Wordmark NORTH AVENUE MEDIA -->
  <text 
    x="160" 
    y="190" 
    text-anchor="middle" 
    font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', sans-serif" 
    font-size="16.5" 
    font-weight="700" 
    letter-spacing="0.28em" 
    fill="#000000">
    NORTH AVENUE MEDIA
  </text>
</svg>
